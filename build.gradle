plugins {
    id 'dev.architectury.loom' version '1.17.491' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.3.1' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}



architectury {
    compileOnly()
    minecraft = project.minecraft_version
}

// Use -PdevYacl=false to open the native topic browser in development.
ext.devYaclEnabled = providers.gradleProperty('devYacl').map { it.toBoolean() }.getOrElse(true)

// Real, loader-specific FTB integration fixtures are deliberately opt-in.
ext.ftbGameTestsEnabled = providers.gradleProperty('ftbGameTests')
        .map { it.toBoolean() }.getOrElse(false)
ext.ftbGameTestsWithFtb = providers.gradleProperty('ftbGameTestsWithFtb')
        .map { it.toBoolean() }.getOrElse(true)

if (ftbGameTestsEnabled) {
    tasks.register('ftbGameTest') {
        group = 'verification'
        description = 'Runs the isolated native FTB integration suite on Fabric and NeoForge.'
        dependsOn ':fabric:runFtbGameTest', ':neoforge:runFtbGameTest'
    }
}

// Opt-in manual test content. This pack is not a mod resource or a runClient dependency.
tasks.register('testDatapack', Zip) {
    group = 'distribution'
    description = 'Package the optional NPC testing datapack for manual installation.'
    from layout.projectDirectory.dir('datapacks/shadowedhearts-testing')
    archiveFileName = "ShadowedHearts-testing-${project.minecraft_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('datapacks')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('shadowLearnsetExample', Zip) {
    group = 'distribution'
    description = 'Package the optional Houndour Shadow learnset and its authoring guide.'
    from layout.projectDirectory.dir('datapacks/shadowedhearts-shadow-learnsets')
    archiveFileName = "ShadowedHearts-shadow-learnsets-${project.minecraft_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('datapacks')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Client-side translations for the manually installed testing datapack.
// This is deliberately independent of normal mod builds and client runs.
tasks.register('testResourcePack', Zip) {
    group = 'distribution'
    description = 'Package the optional testing NPC names and dialogue resource pack for manual installation.'
    from layout.projectDirectory.dir('resourcepacks/shadowedhearts-testing')
    archiveFileName = "ShadowedHearts-testing-resources-${project.minecraft_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('resourcepacks')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    // If the module applies the Kotlin plugin, align its toolchain/target
    plugins.withId('org.jetbrains.kotlin.jvm') {
        // Kotlin toolchain (K2+)
        kotlin {
            jvmToolchain(21)
        }

        // Kotlin 1.9+/2.x compilerOptions API
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions {
                jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
                // optional sanity:
                // freeCompilerArgs.addAll("-Xjdk-release=21")
            }
        }

        // Fallback for older kotlin plugin syntax (harmless if unused)
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            if (hasProperty('kotlinOptions')) {
                kotlinOptions {
                    jvmTarget = '21'
                }
            }
        }
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }
    architectury {
        compileOnly()
    }

    repositories {
        mavenCentral()
        maven { url 'https://maven.quiltmc.org/repository/release/'; content { includeGroup 'org.quiltmc.parsers' } }
        maven { url 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
        maven { url 'https://maven.shedaniel.me/'; content { includeGroupByRegex 'me\\.shedaniel.*' } }
        maven { url 'https://repo.sleeping.town/'; content { includeGroup 'dev.emi' } }
        maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
        maven { url 'https://maven.impactdev.net/repository/development/' }
        maven { url 'https://maven.neoforged.net/releases' }
        maven {
            name = "FTB Maven"
            url = "https://maven.ftb.dev/releases"
            content {
                includeGroup "dev.ftb.mods"
            }
        }
        maven { url 'https://thedarkcolour.github.io/KotlinForForge/' }
        // For GitHub-hosted dependencies via JitPack
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        implementation("org.jetbrains.kotlin:kotlin-reflect")
    }

    if (project.path != ':common') {
        loom {
            mods {
                main { // to match the default mod generated for Forge
                    sourceSet project.sourceSets.main
                    sourceSet project(':common').sourceSets.main
                }
            }
        }
    }

    processResources {
        from project(":common").sourceSets.main.resources

        filesMatching(['**/*.mods.toml', '**/pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
            expand project.properties
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

apply from: 'gradle/publishing.gradle'
