plugins {
    id 'com.gradleup.shadow'
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
}

var devEnv = false;

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    mixin {
        defaultRefmapName = "shadowedhearts.refmap.json"
    }
    silentMojangMappingsLicense()
}


configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://maven.su5ed.dev/releases' }
    maven { url 'https://maven.fabricmc.net' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "AzureDoom Mods"
        url = "https://maven.azuredoom.com/mods"
    }
    mavenLocal()
}

dependencies {
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    compileOnly(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    //cobblemon neoforge
    modImplementation("com.cobblemon:neoforge:${cobblemon_version}")

    //kotlin for forge
    modCompileOnly("maven.modrinth:ordsPcFz:4qCjWixP")
    runtimeOnly("maven.modrinth:ordsPcFz:4qCjWixP")

    //iris shaders
    modCompileOnly("maven.modrinth:YL57xq9U:t3ruzodq")

    //rctapi
    modImplementation("curse.maven:radical-cobblemon-trainers-api-1152792:7952419")

    //rctmod
    modImplementation("curse.maven:rctmod-1009534:7913180")

    //owo lib
    modImplementation("io.wispforest:owo-lib-neoforge:${project.owo_version}")

    //accessories
    modImplementation("io.wispforest:accessories-neoforge:${project.accessories_version}")

    implementation ("org.xerial:sqlite-jdbc:3.46.0.0") {
        exclude group: 'org.slf4j'
    }
    if(!devEnv) {
        include("org.xerial:sqlite-jdbc:3.46.0.0")
    } else {
        forgeRuntimeLibrary "org.xerial:sqlite-jdbc:3.46.0.0"
    }

    forgeRuntimeLibrary("io.wispforest:endec:0.1.5.1")
    forgeRuntimeLibrary("io.wispforest.endec:gson:0.1.3.1")
    forgeRuntimeLibrary("io.wispforest.endec:jankson:0.1.3.1")
    forgeRuntimeLibrary("io.wispforest.endec:netty:0.1.2")
    forgeRuntimeLibrary("blue.endless:jankson:1.2.2")

    //modRuntimeOnly("maven.modrinth:AANobbMI:Pb3OXVqC")

    //cobblemon battle extras
    modImplementation("maven.modrinth:2iY8VFqL:dD1HHoh5")

    //cobblemon party extras
    modImplementation("maven.modrinth:x2wZP9kQ:rTJMRXuL")

    //cobblemon mega showdown
    modImplementation("maven.modrinth:SszvX85I:BAOrFYvg")

    //simpleTMs
    modCompileOnly("maven.modrinth:yFqR0DNc:uaKfPMYS")

    //lost lore
    modImplementation("maven.modrinth:49cNEVjn:IJowghCi")

    //wild battle api
    modImplementation("curse.maven:wild-battle-api-1478863:7765020")

    //cobblemon battle tower
    modImplementation("curse.maven:cobblemon-battle-tower-1441260:7957421")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

