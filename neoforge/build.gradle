plugins {
    id 'com.gradleup.shadow'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}

var devEnv = false;

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    // Loom 1.17 processes owo's dependency interfaces before its NeoForge
    // Mojang mapping provider exists. These are dev-only interface hints;
    // dependency mixins still supply the interfaces at runtime.
    interfaceInjection {
        enableDependencyInterfaceInjection.set(false)
    }
    silentMojangMappingsLicense()

    runs {
        client {
            client()
            vmArgs "-Dshadowedhearts.darkBallVfxDuration=10"
        }

        client2 {
            client()
            name = "Minecraft Client 2"
            programArgs "--username", "Dev2"
            runDir "run/client2"
        }
    }
}


configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://maven.su5ed.dev/releases' }
    maven { url 'https://maven.fabricmc.net' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "AzureDoom Mods"
        url = "https://maven.azuredoom.com/mods"
    }
    mavenLocal()
}

dependencies {
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    compileOnly(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    //cobblemon neoforge
    modImplementation("com.cobblemon:neoforge:${cobblemon_version}")

    //kotlin for forge
    modCompileOnly("maven.modrinth:ordsPcFz:${rootProject.kotlin_for_forge_version}")
    runtimeOnly("maven.modrinth:ordsPcFz:${rootProject.kotlin_for_forge_version}")

    //iris shaders
    modCompileOnly("maven.modrinth:YL57xq9U:t3ruzodq")

    //rctapi
    modImplementation("curse.maven:radical-cobblemon-trainers-api-1152792:${rootProject.rct_api_neoforge_file}")

    //rctmod
    modImplementation("curse.maven:rctmod-1009534:${rootProject.rct_mod_neoforge_file}")

    //owo lib
    // The current NeoForge release is published on Modrinth, not Wispforest Maven.
    modImplementation("maven.modrinth:ccKDOlHs:${project.owo_version}")

    //accessories
    modImplementation("io.wispforest:accessories-neoforge:${project.accessories_version}") {
        // Owo is supplied above; its libraries use forgeRuntimeLibrary below.
        // Avoid separate remapped copies of Accessories' older library versions.
        exclude group: 'io.wispforest', module: 'owo-lib-neoforge'
        exclude group: 'io.wispforest', module: 'endec'
        exclude group: 'io.wispforest.endec', module: 'gson'
        exclude group: 'io.wispforest.endec', module: 'jankson'
        exclude group: 'io.wispforest.endec', module: 'netty'
        exclude group: 'blue.endless', module: 'jankson'
    }

    // Loom's dependency source remapper reads modCompileOnly, not plain compileOnly.
    // Keep remapped copies compile-only and provide the original libraries at runtime.
    [
        "io.wispforest:endec:0.1.8.1",
        "io.wispforest.endec:gson:0.1.5.1",
        "io.wispforest.endec:jankson:0.1.5.1",
        "io.wispforest.endec:netty:0.1.4.1",
        "blue.endless:jankson:1.2.2"
    ].each { library ->
        modCompileOnly(library) { transitive = false }
        forgeRuntimeLibrary(library)
    }

    //modRuntimeOnly("maven.modrinth:AANobbMI:Pb3OXVqC")



    //cobblemon mega showdown
    modImplementation("maven.modrinth:SszvX85I:${rootProject.mega_showdown_neoforge_version}")

    //simpleTMs
    modCompileOnly("maven.modrinth:yFqR0DNc:uaKfPMYS")

    //lost lore
    //modImplementation("maven.modrinth:49cNEVjn:vFf95Mjx")

    //wild battle api
    modImplementation("curse.maven:wild-battle-api-1478863:7765020")

    //cobblemon battle tower
    modImplementation("curse.maven:cobblemon-battle-tower-1441260:7957421")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

